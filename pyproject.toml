[project]
name = "visagio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "nbformat>=5.11.1",
    "pydantic>=2.13.5",
    "pyspark>=3.5.0,<4.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "nbconvert>=7.16.0",
    "nbclient>=0.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
builtins = ["dbutils", "display", "spark"]


